<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
  <!-- Outer ring -->
  <circle cx="150" cy="150" r="140" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.4"/>
  <circle cx="150" cy="150" r="125" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.2"/>

  <!-- Zodiac-inspired ring segments -->
  <g opacity="0.15" stroke="url(#goldGrad)" stroke-width="1">
    <line x1="150" y1="10" x2="150" y2="40"/>
    <line x1="150" y1="260" x2="150" y2="290"/>
    <line x1="10" y1="150" x2="40" y2="150"/>
    <line x1="260" y1="150" x2="290" y2="150"/>
    <line x1="51" y1="51" x2="72" y2="72"/>
    <line x1="228" y1="228" x2="249" y2="249"/>
    <line x1="249" y1="51" x2="228" y2="72"/>
    <line x1="72" y1="228" x2="51" y2="249"/>
  </g>

  <!-- Central sun/star burst -->
  <g transform="translate(150,115)">
    <!-- Sun rays -->
    <g opacity="0.6">
      <line x1="0" y1="-38" x2="0" y2="-52" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
      <line x1="25" y1="-29" x2="34" y2="-40" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
      <line x1="38" y1="-0" x2="52" y2="0" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
      <line x1="25" y1="29" x2="34" y2="40" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="38" x2="0" y2="52" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
      <line x1="-25" y1="29" x2="-34" y2="40" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
      <line x1="-38" y1="0" x2="-52" y2="0" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
      <line x1="-25" y1="-29" x2="-34" y2="-40" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- Inner sun circle -->
    <circle cx="0" cy="0" r="28" fill="url(#sunFill)" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Om symbol stylized as a simple crescent + dot -->
    <circle cx="0" cy="-6" r="3" fill="#0a0e27"/>
    <path d="M-10,4 Q-10,-10 0,-12 Q10,-10 10,4 Q8,12 0,10 Q-4,9 -4,4" stroke="#0a0e27" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M-2,10 Q2,16 8,14" stroke="#0a0e27" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Small stars decoration -->
  <g fill="#D4AF37" opacity="0.5">
    <circle cx="85" cy="70" r="2"/>
    <circle cx="220" cy="80" r="1.5"/>
    <circle cx="65" cy="180" r="1.5"/>
    <circle cx="240" cy="170" r="2"/>
    <circle cx="110" cy="55" r="1"/>
    <circle cx="200" cy="60" r="1"/>
    <circle cx="55" cy="130" r="1"/>
    <circle cx="248" cy="120" r="1"/>
  </g>

  <!-- Crescent moon -->
  <g transform="translate(205, 80)" opacity="0.7">
    <path d="M0,0 A15,15 0 1,1 0,30 A12,12 0 1,0 0,0Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Text: GOEL -->
  <text x="150" y="200" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="bold" letter-spacing="8" fill="url(#goldGrad)">GOEL</text>

  <!-- Text: ASTRO -->
  <text x="150" y="232" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="12" fill="url(#goldGrad)" opacity="0.8">ASTRO</text>

  <!-- Decorative line under text -->
  <line x1="95" y1="240" x2="205" y2="240" stroke="url(#goldGrad)" stroke-width="1" opacity="0.4"/>

  <!-- Tagline -->
  <text x="150" y="260" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="9" letter-spacing="3" fill="url(#goldGrad)" opacity="0.5">VEDIC ASTROLOGY</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0D060"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8960C"/>
    </linearGradient>
    <radialGradient id="sunFill" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#F0D060"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </radialGradient>
  </defs>
</svg>
